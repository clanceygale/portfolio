<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Student Registration</title>

    <link rel="stylesheet" href="registration.css">
</head>

<body>

    <div class="container">

        <div class="welcome">

            <div class="heart">
                ♡
            </div>

            <p class="small-title">
                WELCOME ♡
            </p>

            <h1>
                Join Our
                <span>Community</span>
            </h1>

            <p class="description">
                Create your account and become
                part of our student community.
            </p>

            <div class="decorations">
                ✦ &nbsp; ♡ &nbsp; ✦
            </div>

            <div class="note">
                <p>
                    “Small steps,
                    <br>
                    big dreams.”
                </p>
            </div>

        </div>

        <div class="form-section">

            <div class="form-title">

                <p>
                    ♡ CREATE YOUR ACCOUNT
                </p>

                <h2>
                    Registration Form
                </h2>

                <span>
                    Please fill out the information below.
                </span>

            </div>


            <form>

                <div class="row">

                    <div class="input-group">

                        <label>
                            First Name
                        </label>

                        <input
                            type="text"
                            placeholder="Enter first name"
                            required>

                    </div>


                    <div class="input-group">

                        <label>
                            Last Name
                        </label>

                        <input
                            type="text"
                            placeholder="Enter last name"
                            required>

                    </div>

                </div>

                <div class="input-group">

                    <label>
                        Email Address
                    </label>

                    <input
                        type="email"
                        placeholder="example@email.com"
                        required>

                </div>

                <div class="input-group">

                    <label>
                        Phone Number
                    </label>

                    <input
                        type="tel"
                        placeholder="09XX XXX XXXX"
                        required>

                </div>

                <div class="row">

                    <div class="input-group">

                        <label>
                            Date of Birth
                        </label>

                        <input
                            type="date"
                            required>

                    </div>


                    <div class="input-group">

                        <label>
                            Gender
                        </label>

                        <select required>

                            <option value="">
                                Select
                            </option>

                            <option>
                                Female
                            </option>

                            <option>
                                Male
                            </option>

                            <option>
                                Prefer not to say
                            </option>

                        </select>

                    </div>

                </div>

                <div class="input-group">

                    <label>
                        Address
                    </label>

                    <input
                        type="text"
                        placeholder="Enter your address"
                        required>

                </div>

                <div class="row">

                    <div class="input-group">

                        <label>
                            Password
                        </label>

                        <input
                            type="password"
                            placeholder="Create password"
                            required>

                    </div>


                    <div class="input-group">

                        <label>
                            Confirm Password
                        </label>

                        <input
                            type="password"
                            placeholder="Confirm password"
                            required>

                    </div>

                </div>

                <div class="terms">

                    <input
                        type="checkbox"
                        required>

                    <p>
                        I agree to the
                        <a href="#">
                            Terms & Conditions
                        </a>
                    </p>

                </div>

                <button type="submit">
                    Create Account ♡
                </button>


                <p class="login">
                    Already have an account?
                    <a href="#">
                        Login
                </a>

                <button type="submit" class="next">
                    Login ♡
                </button>
                  
                </p>

            </form>

        </div>

    </div>


</body>
</html>
